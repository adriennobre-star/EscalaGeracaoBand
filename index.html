<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escala Geração Band</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style id="app-style">
:root{
  --cream:#FBF4E6;
  --cream-deep:#F1E2C4;
  --card:#FFFFFF;
  --ink:#1E2A28;
  --ink-soft:#5B6E69;
  --teal:#1B7D77;
  --teal-dark:#0F4F4B;
  --teal-tint:#E2F1EF;
  --gold:#DE9F2E;
  --gold-dark:#A96F14;
  --gold-tint:#FBEBC9;
  --border:#E8DCC2;
  --danger:#B14B3A;
  --wa-green:#25D366;
  --shadow:0 10px 28px rgba(24,36,33,.10);
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#0E211F;
    --cream-deep:#153531;
    --card:#173733;
    --ink:#F3ECDC;
    --ink-soft:#B7CAC5;
    --teal:#49C2B8;
    --teal-dark:#2E948B;
    --teal-tint:#1B403B;
    --gold:#F2BE55;
    --gold-dark:#F7D385;
    --gold-tint:#2C2413;
    --border:#28504A;
    --danger:#E1806E;
    --shadow:0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --cream:#0E211F;
  --cream-deep:#153531;
  --card:#173733;
  --ink:#F3ECDC;
  --ink-soft:#B7CAC5;
  --teal:#49C2B8;
  --teal-dark:#2E948B;
  --teal-tint:#1B403B;
  --gold:#F2BE55;
  --gold-dark:#F7D385;
  --gold-tint:#2C2413;
  --border:#28504A;
  --danger:#E1806E;
  --shadow:0 10px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-inline:16px;
  padding-block:22px 60px;
  max-width:980px;
  margin-inline:auto;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Baloo 2","Manrope",sans-serif;margin:0;text-wrap:balance;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--gold-tint);color:var(--ink);}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.brand{display:flex;align-items:center;gap:14px;min-width:0;}
.brand-logo{
  width:74px;height:auto;border-radius:16px;
  box-shadow:var(--shadow);
  flex-shrink:0;
  display:block;
}
.brand-text{min-width:0;}
.brand-eyebrow{
  display:block;font-size:12.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--teal);margin-bottom:2px;
}
.brand-text h1{font-size:clamp(20px,4.4vw,28px);font-weight:700;color:var(--ink);line-height:1.15;}
.brand-text .brand-sub{display:block;font-size:13px;color:var(--ink-soft);margin-top:3px;}

.me-chip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--card);border:1.5px solid var(--border);
  padding:9px 14px;border-radius:999px;cursor:pointer;
  font-size:13.5px;font-weight:700;color:var(--ink);
  box-shadow:var(--shadow);
  white-space:nowrap;
}
.me-chip:hover{border-color:var(--teal);}
.me-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;}

.topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--card);border:1.5px solid var(--border);
  width:42px;height:42px;border-radius:50%;cursor:pointer;padding:0;
  color:var(--ink-soft);box-shadow:var(--shadow);flex-shrink:0;
}
.icon-btn:hover{border-color:var(--teal);color:var(--teal);}
.icon-btn svg{width:19px;height:19px;display:block;}
.wa-btn{
  width:auto;border-radius:999px;padding:9px 14px 9px 12px;gap:7px;
  background:var(--wa-green);border-color:var(--wa-green);color:#fff;
  font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;
}
.wa-btn:hover{filter:brightness(1.08);border-color:var(--wa-green);color:#fff;}
.wa-btn svg{width:18px;height:18px;}

.week-nav{
  display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;margin-bottom:4px;
  scrollbar-width:thin;
}
.week-nav a{
  flex-shrink:0;
  background:var(--card);border:1.5px solid var(--border);
  padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;
  text-decoration:none;color:var(--ink-soft);white-space:nowrap;
}
.week-nav a:hover{border-color:var(--teal);color:var(--teal);}

.weeks{display:flex;flex-direction:column;gap:18px;}

.week-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;box-shadow:var(--shadow);scroll-margin-top:14px;
}
.week-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.week-date{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--teal);color:#fff;border-radius:var(--radius-md);
  width:58px;height:58px;flex-shrink:0;
}
.week-date .dow{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.85;}
.week-date .num{font-size:22px;font-weight:800;line-height:1;font-family:"Baloo 2",sans-serif;}
.week-date .mon{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85;}
.week-title{flex:1;min-width:0;}
.week-title h2{font-size:17px;font-weight:700;color:var(--ink);}
.week-progress{display:flex;align-items:center;gap:8px;margin-top:6px;}
.week-progress .bar{flex:1;max-width:140px;height:6px;border-radius:4px;background:var(--cream-deep);overflow:hidden;}
.week-progress .bar span{display:block;height:100%;background:var(--gold);border-radius:4px;}
.week-progress .label{font-size:12px;color:var(--ink-soft);font-weight:600;white-space:nowrap;}
.periods{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;
}
.period{background:var(--cream);border:1px solid var(--border);border-radius:var(--radius-md);padding:13px;perspective:1000px;}
.period-flip-inner{transition:transform .16s ease-in;}
.period-flip-inner.flip-mid{transform:rotateY(90deg);}
.period-title{
  font-size:13px;font-weight:800;color:var(--teal-dark);margin-bottom:10px;
  display:flex;align-items:baseline;gap:6px;
}
.period-title .time{font-weight:700;color:var(--ink-soft);font-size:12px;}
.period-title.back{color:var(--gold-dark);}
.repertoire-toggle{
  margin-left:auto;width:26px;height:26px;border-radius:50%;border:none;flex-shrink:0;
  background:transparent;color:var(--ink-soft);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}
.repertoire-toggle:hover{background:var(--teal-tint);color:var(--teal-dark);}
.repertoire-toggle svg{width:15px;height:15px;display:block;}
.song-list{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px;}
.song-row{display:flex;align-items:center;gap:8px;}
.song-icon{
  width:22px;height:22px;flex-shrink:0;border-radius:7px;
  background:var(--gold-tint);color:var(--gold-dark);
  display:flex;align-items:center;justify-content:center;
}
.song-icon svg{width:12px;height:12px;}
.song-name{
  flex:1;text-align:left;background:transparent;border:none;padding:5px 6px;
  font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;border-radius:8px;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.song-name:hover{background:var(--cream-deep);}
.song-remove{
  width:22px;height:22px;flex-shrink:0;border:none;background:transparent;
  color:var(--ink-soft);border-radius:50%;cursor:pointer;font-size:15px;line-height:1;
}
.song-remove:hover{background:var(--danger);color:#fff;}
.song-empty{font-size:12px;color:var(--ink-soft);padding:4px 0 8px;}
.song-add{display:flex;gap:6px;}
.song-add-input{
  flex:1;min-width:0;border:1.5px solid var(--border);border-radius:999px;
  padding:7px 12px;font-size:12.5px;background:var(--card);color:var(--ink);
}
.btn-sm{padding:7px 12px;font-size:12px;}
.role-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
.role-row{display:flex;align-items:center;gap:9px;}
.role-icon{
  width:26px;height:26px;flex-shrink:0;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:var(--teal-tint);color:var(--teal-dark);
}
.role-icon svg{width:15px;height:15px;}
.role-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);width:84px;flex-shrink:0;}
.name-chip{
  flex:1;display:inline-flex;align-items:center;gap:7px;
  background:var(--teal);color:#fff;border:none;border-radius:999px;
  padding:6px 12px 6px 6px;cursor:pointer;font-size:12.5px;font-weight:700;
  text-align:left;min-width:0;
}
.name-chip:hover{background:var(--teal-dark);}
.name-chip .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip-avatar{
  width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;
  flex-shrink:0;
}
.open-slot{
  flex:1;background:transparent;border:1.5px dashed var(--gold);color:var(--gold-dark);
  border-radius:999px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:700;
  text-align:left;
}
.open-slot:hover{background:var(--gold-tint);}

.btn{
  border-radius:999px;border:1.5px solid transparent;padding:10px 18px;font-size:13.5px;
  font-weight:700;cursor:pointer;
}
.btn-ghost{background:var(--card);border-color:var(--border);color:var(--ink);box-shadow:var(--shadow);}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-dark);}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-primary:disabled{opacity:.6;cursor:default;}
.btn-text{background:transparent;border:none;color:var(--ink-soft);text-decoration:underline;font-size:12.5px;font-weight:700;cursor:pointer;padding:6px;}
.btn-danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}

.roster-toggle-row{display:flex;justify-content:center;margin-top:6px;}
.roster-panel{
  margin-top:16px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow);
}
.roster-panel h3{font-size:14px;margin-bottom:10px;color:var(--ink);}
.roster-chips{display:flex;flex-wrap:wrap;gap:8px;}
.roster-chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--cream);
  border:1px solid var(--border);border-radius:999px;padding:6px 6px 6px 12px;
  font-size:12.5px;font-weight:600;
}
.roster-chip button{
  border:none;background:var(--cream-deep);color:var(--ink-soft);border-radius:50%;
  width:18px;height:18px;cursor:pointer;font-size:10px;line-height:1;
}
.roster-add{display:flex;gap:8px;margin-top:12px;}
.roster-add input{flex:1;}

footer{margin-top:28px;text-align:center;font-size:11.5px;color:var(--ink-soft);}
footer .foot-logo{opacity:.55;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(14,20,19,.55);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:0;
}
@media(min-width:640px){.modal-overlay{align-items:center;padding:20px;}}
.modal{
  background:var(--card);width:100%;max-width:420px;
  border-radius:20px 20px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 40px rgba(0,0,0,.25);
  max-height:86vh;overflow-y:auto;
}
@media(min-width:640px){.modal{border-radius:20px;padding:24px;}}
.modal h3{font-size:16.5px;margin-bottom:2px;}
.modal .modal-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.modal input[type=text]{
  width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--cream);color:var(--ink);font-size:15px;font-family:inherit;margin-bottom:12px;
}
.modal input[type=text]:focus{outline:2px solid var(--teal);outline-offset:1px;}
.quick-picks{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.quick-pick{
  background:var(--teal-tint);border:1px solid transparent;color:var(--teal-dark);
  border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;
}
.quick-pick:hover{border-color:var(--teal);}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.modal-actions .btn{flex:1;min-width:110px;}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--ink);color:var(--cream);padding:11px 18px;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:60;max-width:88vw;
  text-align:center;
}
:root[data-theme="dark"] .toast, @media (prefers-color-scheme:dark){ .toast{background:var(--card);border:1px solid var(--border);} }

.loading-state, .error-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.error-state .btn{margin-top:14px;}

.admin-main{display:flex;flex-direction:column;gap:18px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.stat-tile{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;box-shadow:var(--shadow);text-align:center;
}
.stat-value{display:block;font-family:"Baloo 2",sans-serif;font-size:30px;font-weight:800;color:var(--teal-dark);line-height:1;}
.stat-label{display:block;margin-top:6px;font-size:12px;color:var(--ink-soft);font-weight:600;}
.chart-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;box-shadow:var(--shadow);
}
.chart-card h3{font-size:15px;margin-bottom:4px;color:var(--ink);}
.chart-note{font-size:12px;color:var(--ink-soft);margin:0 0 12px;}
.bar-list{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-label{width:132px;flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:10px;border-radius:6px;background:var(--cream-deep);overflow:hidden;}
.bar-fill{display:block;height:100%;background:var(--teal);border-radius:6px;}
.bar-value{width:56px;flex-shrink:0;text-align:right;font-size:12px;font-weight:700;color:var(--ink-soft);}
.admin-empty{font-size:12.5px;color:var(--ink-soft);padding:6px 0 2px;}
.scroll-list{max-height:340px;overflow-y:auto;padding-right:6px;}
.admin-footnote{margin-top:6px;}

.proj-list{display:flex;flex-direction:column;gap:14px;margin-top:4px;}
.proj-week{background:var(--cream);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;}
.proj-week-title{font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:10px;}
.proj-week .period{background:var(--card);}
.proj-name{
  flex:1;display:inline-flex;align-items:center;gap:7px;
  background:var(--teal-tint);color:var(--teal-dark);border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:700;min-width:0;
}
.proj-name .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.rank-row:last-child{border-bottom:none;}
.rank-badge{
  width:27px;height:27px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800;font-family:"Baloo 2",sans-serif;
  background:var(--teal-tint);color:var(--teal-dark);
}
.rank-badge.r1{background:linear-gradient(155deg,#F2CE7E,#DE9F2E);color:#4A3106;}
.rank-badge.r2{background:linear-gradient(155deg,#E3E9EC,#B7C2C7);color:#38424A;}
.rank-badge.r3{background:linear-gradient(155deg,#E9CAA6,#C79868);color:#4A3319;}
.rank-name{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rank-track{flex:1.4;height:9px;border-radius:5px;background:var(--cream-deep);overflow:hidden;max-width:150px;}
.rank-fill{display:block;height:100%;background:var(--teal);border-radius:5px;}
.rank-fill.gold{background:var(--gold);}
.rank-count{width:50px;flex-shrink:0;text-align:right;font-size:12px;font-weight:700;color:var(--ink-soft);}

.formation-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;}
.formation-chip{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:var(--cream);border:1.5px solid var(--border);border-radius:var(--radius-md);
  padding:13px 10px 11px;min-width:88px;flex:1 1 88px;
}
.formation-chip.typical{border-color:var(--teal);background:var(--teal-tint);}
.formation-chip .fc-icon{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--card);color:var(--ink-soft);flex-shrink:0;
}
.formation-chip .fc-icon svg{width:18px;height:18px;}
.formation-chip.typical .fc-icon{background:var(--teal);color:#fff;}
.formation-chip .fc-count{font-family:"Baloo 2",sans-serif;font-size:16.5px;font-weight:800;color:var(--ink);line-height:1;}
.formation-chip.rare .fc-count{color:var(--ink-soft);}
.formation-chip .fc-label{font-size:11px;font-weight:700;color:var(--ink-soft);text-align:center;line-height:1.25;}
.formation-chip.typical .fc-label{color:var(--teal-dark);}
.formation-chip .fc-pct{font-size:10px;font-weight:700;color:var(--ink-soft);}
.formation-sentence{font-size:13px;color:var(--ink-soft);line-height:1.65;margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);}
.formation-sentence b{color:var(--ink);}
@media (max-width:480px){
  .formation-chip{min-width:76px;padding:11px 6px 9px;}
  .rank-name{font-size:12px;}
}

[hidden]{display:none!important;}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
@media (prefers-reduced-motion:no-preference){
  .week-card,.modal{transition:transform .15s ease;}
}
@media (max-width:480px){
  .role-label{width:auto;flex:1;}
  .name-chip .txt, .open-slot{white-space:normal;}
  .bar-label{width:98px;font-size:11.5px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwsGVjarb2muz1iH4br5Qk4qs5OGDp4YPDg08bvdKvxFTEQQRyN8j56EW6toUuPg9vjSQ/exec";

  function getThemePref(){
    var v = null;
    try{ v = localStorage.getItem("gbrp_theme"); }catch(e){}
    return (v === "light" || v === "dark") ? v : "system";
  }
  function applyTheme(pref){
    if(pref === "light" || pref === "dark"){
      document.documentElement.setAttribute("data-theme", pref);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function initials(name){
    var parts = String(name).trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return "?";
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }
  function parseISODate(iso){
    var p = iso.split("-").map(Number);
    return new Date(Date.UTC(p[0], p[1]-1, p[2]));
  }
  function toISODate(d){ return d.toISOString().slice(0,10); }
  function collectSundaysOfMonth(y, m, minDate, out){
    var d = new Date(Date.UTC(y, m, 1));
    while(d.getUTCMonth() === m){
      if(d.getUTCDay() === 0){
        if(!minDate || d.getTime() >= minDate.getTime()){ out.push(toISODate(d)); }
      }
      d.setUTCDate(d.getUTCDate() + 1);
    }
  }
  function getVisibleWeekIds(){
    var today = new Date();
    var todayUTC = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
    var y = todayUTC.getUTCFullYear(), m = todayUTC.getUTCMonth();
    var ids = [];
    collectSundaysOfMonth(y, m, todayUTC, ids);
    var nm = m + 1, ny = y;
    if(nm > 11){ nm = 0; ny = y + 1; }
    collectSundaysOfMonth(ny, nm, null, ids);
    return ids;
  }
  function pruneOldAssignments(s){
    var cutoff = new Date();
    cutoff.setUTCDate(cutoff.getUTCDate() - 45);
    var cutoffISO = toISODate(new Date(Date.UTC(cutoff.getFullYear(), cutoff.getMonth(), cutoff.getDate())));
    Object.keys(s.assignments || {}).forEach(function(weekId){
      if(weekId < cutoffISO){ delete s.assignments[weekId]; }
    });
    Object.keys(s.repertoire || {}).forEach(function(weekId){
      if(weekId < cutoffISO){ delete s.repertoire[weekId]; }
    });
  }
  function weekTitle(iso){
    var d = parseISODate(iso);
    return WEEKDAYS[d.getUTCDay()] + ", " + d.getUTCDate() + " de " + MONTHS[d.getUTCMonth()];
  }
  function weekBadge(iso){
    var d = parseISODate(iso);
    return {
      num: String(d.getUTCDate()).padStart(2,"0"),
      mon: MONTHS[d.getUTCMonth()].slice(0,3).toUpperCase(),
      dow: WEEKDAYS[d.getUTCDay()].slice(0,3).toUpperCase()
    };
  }
  function cloneState(s){ return JSON.parse(JSON.stringify(s)); }
  function getAssignment(s, weekId, periodId, roleId){
    return (s.assignments[weekId] && s.assignments[weekId][periodId] && s.assignments[weekId][periodId][roleId]) || "";
  }
  function setAssignment(s, weekId, periodId, roleId, name){
    if(!s.assignments[weekId]) s.assignments[weekId] = {};
    if(!s.assignments[weekId][periodId]) s.assignments[weekId][periodId] = {};
    s.assignments[weekId][periodId][roleId] = name;
    if(name && s.roster.indexOf(name) === -1){
      s.roster.push(name);
      s.roster.sort(function(a,b){ return a.localeCompare(b, "pt-BR"); });
    }
    return s;
  }
  function getRepertoire(s, weekId){
    return (s.repertoire && s.repertoire[weekId]) || [];
  }
  function setRepertoire(s, weekId, songs){
    if(!s.repertoire) s.repertoire = {};
    s.repertoire[weekId] = songs;
  }
  function countFilled(s, weekId){
    var total = PERIODS.length * ROLES.length, filled = 0;
    PERIODS.forEach(function(p){
      ROLES.forEach(function(r){
        if(getAssignment(s, weekId, p.id, r.id)) filled++;
      });
    });
    return {filled: filled, total: total};
  }

  function roleRowHtml(weekId, periodId, role){
    var name = getAssignment(currentState, weekId, periodId, role.id);
    var slotKey = weekId + "|" + periodId + "|" + role.id;
    if(name){
      return '<li class="role-row filled">' +
        '<span class="role-icon">' + ICONS[role.id] + '</span>' +
        '<span class="role-label">' + role.label + '</span>' +
        '<button type="button" class="name-chip" data-action="edit" data-slot="' + slotKey + '">' +
          '<span class="chip-avatar">' + escapeHtml(initials(name)) + '</span>' +
          '<span class="txt">' + escapeHtml(name) + '</span>' +
        '</button>' +
      '</li>';
    }
    return '<li class="role-row empty">' +
      '<span class="role-icon">' + ICONS[role.id] + '</span>' +
      '<span class="role-label">' + role.label + '</span>' +
      '<button type="button" class="open-slot" data-action="assign" data-slot="' + slotKey + '">+ Vaga livre</button>' +
    '</li>';
  }

    var parts = key.split("|");

  function startAdminPolling(){

      fetchAdminLog(adminPin).then(function(data){

        if(changed){

  function computeAdminStats(log){
    var finalSlots = {};
    (log || []).forEach(function(entry){
      var key = entry.weekId + "|" + entry.periodId + "|" + entry.roleId;
      finalSlots[key] = entry;
    });

    var todayISO = toISODate(new Date());
    var porPessoa = {};
    var porCondutor = {};
    var cultos = {}; // "weekId|periodId" -> quantidade de vagas preenchidas
    var roleCultoSet = {};
    ROLES.forEach(function(r){ roleCultoSet[r.id] = {}; });

    Object.keys(finalSlots).forEach(function(key){
      var entry = finalSlots[key];
      if(!entry.name) return;
      if(entry.weekId > todayISO) return; // culto ainda não aconteceu
      var cultoKey = entry.weekId + "|" + entry.periodId;
      porPessoa[entry.name] = (porPessoa[entry.name] || 0) + 1;
      if(entry.roleId === "condutor"){
        porCondutor[entry.name] = (porCondutor[entry.name] || 0) + 1;
      }
      cultos[cultoKey] = (cultos[cultoKey] || 0) + 1;
      if(roleCultoSet[entry.roleId]) roleCultoSet[entry.roleId][cultoKey] = true;
    });

    var totalCultos = Object.keys(cultos).length;
    var totalFilledSlots = Object.keys(cultos).reduce(function(sum, k){ return sum + cultos[k]; }, 0);
    var formacaoMedia = totalCultos ? (totalFilledSlots / totalCultos) : 0;

    var porInstrumento = ROLES.map(function(r){
      var count = Object.keys(roleCultoSet[r.id] || {}).length;
      return {id: r.id, label: r.label, count: count, pct: totalCultos ? Math.round((count / totalCultos) * 100) : 0};
    }).sort(function(a, b){ return b.count - a.count; });

    function toRanked(obj){
      return Object.keys(obj).map(function(name){ return {name: name, count: obj[name]}; })
        .sort(function(a, b){ return b.count - a.count || a.name.localeCompare(b.name, "pt-BR"); });
    }

    var porRemocao = {};
    (log || []).forEach(function(entry){
      if(entry.type === "remove" && entry.actor){
        porRemocao[entry.actor] = (porRemocao[entry.actor] || 0) + 1;
      }
    });

    // Projeção das próximas escalas: tudo que já está confirmado para
    // cultos futuros (estritamente depois de hoje — hoje/passado já entra
    // nos números acima). Toda vaga preenchida conta, mesmo que aquele
    // instrumento apareça só nesse único culto.
    var roleLabel = {};
    ROLES.forEach(function(r){ roleLabel[r.id] = r.label; });
    var porSemana = {};
    Object.keys(finalSlots).forEach(function(key){
      var entry = finalSlots[key];
      if(!entry.name) return;
      if(entry.weekId <= todayISO) return; // já aconteceu ou é hoje
      if(!porSemana[entry.weekId]) porSemana[entry.weekId] = {};
      if(!porSemana[entry.weekId][entry.periodId]) porSemana[entry.weekId][entry.periodId] = [];
      porSemana[entry.weekId][entry.periodId].push(entry);
    });
    var proximasEscalas = Object.keys(porSemana).sort().map(function(weekId){
      var periods = PERIODS.filter(function(p){
        return porSemana[weekId][p.id] && porSemana[weekId][p.id].length;
      }).map(function(p){
        var roles = porSemana[weekId][p.id].map(function(entry){
          return {roleId: entry.roleId, label: roleLabel[entry.roleId] || entry.roleId, name: entry.name};
        }).sort(function(a, b){ return a.label.localeCompare(b.label, "pt-BR"); });
        return {periodId: p.id, label: p.label, time: p.time, roles: roles};
      });
      return {weekId: weekId, periods: periods};
    });

    return {
      totalCultos: totalCultos,
      formacaoMedia: formacaoMedia,
      porPessoa: toRanked(porPessoa),
      porCondutor: toRanked(porCondutor),
      porInstrumento: porInstrumento,
      porRemocao: toRanked(porRemocao),
      proximasEscalas: proximasEscalas
    };
  }

  function barListHtml(items, opts){
    opts = opts || {};
    if(!items.length){
      return '<div class="admin-empty">Ainda não há dados suficientes.</div>';
    }
    var max = items.reduce(function(m, it){ return Math.max(m, it.count); }, 0) || 1;
    return '<div class="bar-list">' + items.map(function(it){
      var pct = Math.round((it.count / max) * 100);
      return '<div class="bar-row">' +
        '<span class="bar-label" title="' + escapeHtml(it.label) + '">' + escapeHtml(it.label) + '</span>' +
        '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
        '<span class="bar-value">' + it.count + (opts.suffix || '') + '</span>' +
      '</div>';
    }).join("") + '</div>';
  }

  function rankListHtml(items, opts){
    opts = opts || {};
    if(!items.length){
      return '<div class="admin-empty">Ainda não há dados suficientes.</div>';
    }
    var max = items.reduce(function(m, it){ return Math.max(m, it.count); }, 0) || 1;
    return '<div class="bar-list">' + items.map(function(it, i){
      var pct = Math.round((it.count / max) * 100);
      var rankClass = i === 0 ? " r1" : i === 1 ? " r2" : i === 2 ? " r3" : "";
      var badgeContent = i < 3 ? String(i + 1) : escapeHtml(initials(it.name));
      return '<div class="rank-row">' +
        '<span class="rank-badge' + rankClass + '">' + badgeContent + '</span>' +
        '<span class="rank-name" title="' + escapeHtml(it.name) + '">' + escapeHtml(it.name) + '</span>' +
        '<span class="rank-track"><span class="rank-fill' + (i === 0 ? " gold" : "") + '" style="width:' + pct + '%"></span></span>' +
        '<span class="rank-count">' + it.count + (opts.suffix || '') + '</span>' +
      '</div>';
    }).join("") + '</div>';
  }

  function formationChipsHtml(porInstrumento, totalCultos){
    if(!totalCultos){
      return '<div class="admin-empty">Ainda não há dados suficientes.</div>';
    }
    var sorted = porInstrumento.slice().sort(function(a, b){ return b.pct - a.pct; });
    var chips = sorted.map(function(r){
      var typical = r.pct >= 50;
      return '<div class="formation-chip ' + (typical ? "typical" : "rare") + '">' +
        '<span class="fc-icon">' + ICONS[r.id] + '</span>' +
        '<span class="fc-count">' + (typical ? "1×" : "—") + '</span>' +
        '<span class="fc-label">' + escapeHtml(r.label) + '</span>' +
        '<span class="fc-pct">' + r.pct + '% dos cultos</span>' +
      '</div>';
    }).join("");
    var typicalRoles = sorted.filter(function(r){ return r.pct >= 50; });
    var sentence = typicalRoles.length ?
      'Em média, um culto do Geração Band conta com <b>' + typicalRoles.map(function(r){ return "1 " + r.label; }).join(", ") + '</b>. As demais funções aparecem com menos frequência (veja o percentual em cada cartão).' :
      'Ainda não há cultos suficientes registrados para apontar uma formação típica — os números aparecem conforme as pessoas forem se escalando.';
    return '<div class="formation-row">' + chips + '</div>' +
      '<p class="formation-sentence">' + sentence + '</p>';
  }

  function proximasEscalasHtml(list){
    if(!list || !list.length){
      return '<div class="admin-empty">Ainda não há ninguém confirmado nos próximos cultos.</div>';
    }
    return '<div class="proj-list">' + list.map(function(week){
      var periodsHtml = week.periods.map(function(period){
        var rolesHtml = period.roles.map(function(r){
          return '<li class="role-row filled">' +
            '<span class="role-icon">' + (ICONS[r.roleId] || "") + '</span>' +
            '<span class="role-label">' + escapeHtml(r.label) + '</span>' +
            '<span class="proj-name"><span class="txt">' + escapeHtml(r.name) + '</span></span>' +
          '</li>';
        }).join("");
        return '<div class="period">' +
          '<div class="period-title">' + escapeHtml(period.label) + ' <span class="time">· ' + escapeHtml(period.time) + '</span></div>' +
          '<ul class="role-list">' + rolesHtml + '</ul>' +
        '</div>';
      }).join("");
      return '<div class="proj-week">' +
        '<div class="proj-week-title">' + weekTitle(week.weekId) + '</div>' +
        '<div class="periods">' + periodsHtml + '</div>' +
      '</div>';
    }).join("") + '</div>';
  }

  function renderAdminBody(stats){
    var pessoasTop = stats.porPessoa.slice(0, 10);
    var pessoasTodas = stats.porPessoa;
    var condutores = stats.porCondutor;
    var qtdCondutores = stats.porCondutor.length;

    return '' +
      '<header class="topbar">' +
        '<div class="brand">' +
          '<img class="brand-logo" src="' + LOGO_DATA_URI + '" alt="Logo Geração RIO">' +
          '<div class="brand-text">' +
            '<span class="brand-eyebrow">Geração Band · Admin</span>' +
            '<h1>Painel do administrador</h1>' +
            '<span class="brand-sub">Estatísticas dos cultos já realizados</span>' +
          '</div>' +
        '</div>' +
        '<div class="topbar-actions">' +
          '<button type="button" class="btn btn-ghost" id="adminShareBtn">Compartilhar como imagem</button>' +
          '<button type="button" class="btn btn-ghost" id="adminBackBtn">← Voltar para a escala</button>' +
        '</div>' +
      '</header>' +
      '<main class="admin-main">' +
        '<div class="stat-grid">' +
          '<div class="stat-tile"><span class="stat-value">' + stats.totalCultos + '</span><span class="stat-label">Cultos já realizados (com escala)</span></div>' +
          '<div class="stat-tile"><span class="stat-value">' + stats.formacaoMedia.toFixed(1) + '</span><span class="stat-label">Pessoas por culto, em média</span></div>' +
          '<div class="stat-tile"><span class="stat-value">' + stats.porPessoa.length + '</span><span class="stat-label">Pessoas diferentes que já serviram</span></div>' +
          '<div class="stat-tile"><span class="stat-value">' + qtdCondutores + '</span><span class="stat-label">Condutores diferentes</span></div>' +
        '</div>' +

        '<section class="chart-card">' +
          '<h3>Próximas escalas</h3>' +
          '<p class="chart-note">Quem já está confirmado nos próximos cultos — todo instrumento preenchido conta, mesmo que apareça só uma vez.</p>' +
          proximasEscalasHtml(stats.proximasEscalas) +
        '</section>' +

        '<section class="chart-card">' +
          '<h3>Formação média dos cultos</h3>' +
          '<p class="chart-note">Não é uma contagem — é quem costuma estar no palco. Cartões destacados (' + escapeHtml("≥") + '50% dos cultos) mostram a formação típica; os demais aparecem com menos frequência.</p>' +
          formationChipsHtml(stats.porInstrumento, stats.totalCultos) +
        '</section>' +

        '<section class="chart-card">' +
          '<h3>Condutores (' + qtdCondutores + ' diferente' + (qtdCondutores === 1 ? "" : "s") + ')</h3>' +
          '<p class="chart-note">Todo mundo que já conduziu, do que mais atuou ao que menos atuou — com a quantidade de cultos conduzidos por cada um.</p>' +
          rankListHtml(condutores, {suffix: "×"}) +
        '</section>' +

        '<section class="chart-card">' +
          '<h3>Pessoas que mais se inscreveram</h3>' +
          '<p class="chart-note">Top 10 por quantidade de vagas em que serviram.</p>' +
          rankListHtml(pessoasTop, {suffix: "×"}) +
        '</section>' +

        '<section class="chart-card">' +
          '<h3>Todas as pessoas que já se inscreveram (' + pessoasTodas.length + ')</h3>' +
          '<div class="scroll-list">' + rankListHtml(pessoasTodas, {suffix: "×"}) + '</div>' +
        '</section>' +

        '<section class="chart-card">' +
          '<h3>Quem mais tirou o nome da escala</h3>' +
          '<p class="chart-note">Toda vez que alguém toca em "Deixar vaga livre" e informa o nome, contamos aqui. Remoções feitas antes dessa função existir não entram na conta.</p>' +
          rankListHtml(stats.porRemocao, {suffix: "×"}) +
        '</section>' +
      '</main>' +
      '<footer>Calculado a partir de ' + ((adminLog && adminLog.length) || 0) + ' registros de histórico.<br><span class="admin-footnote">Painel privado — não compartilhe o código de acesso.</span></footer>' +
      '<div class="modal-overlay" id="modalOverlay" hidden>' +
        '<div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>' +
      '</div>' +
      '<div class="toast" id="toastEl" hidden></div>';
  }

  function renderAdmin(){
    var app = document.getElementById("app");
    app.innerHTML = renderAdminBody(computeAdminStats(adminLog));
  }

  /* ---------- Compartilhar o painel como imagem (JPEG) ---------- */

  var HTML2CANVAS_SRC = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
  var html2canvasLoadingPromise = null;

  function ensureHtml2Canvas(){
    if(window.html2canvas) return Promise.resolve();
    if(html2canvasLoadingPromise) return html2canvasLoadingPromise;
    html2canvasLoadingPromise = new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = HTML2CANVAS_SRC;
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error("load_failed")); };
      document.head.appendChild(s);
    });
    return html2canvasLoadingPromise;
  }

  // Painéis longos (ex.: lista de todas as pessoas) ficam com scroll
  // interno (max-height + overflow) pra caber na tela. Pra imagem sair
  // com tudo visível — "página inteira" — a gente solta esse limite só
  // durante a captura e devolve como estava logo depois.
  function expandScrollListsForCapture_(root){
    var els = root.querySelectorAll(".scroll-list");
    var saved = [];
    els.forEach(function(el){
      saved.push({el: el, maxHeight: el.style.maxHeight, overflow: el.style.overflow});
      el.style.maxHeight = "none";
      el.style.overflow = "visible";
    });
    return function restore(){
      saved.forEach(function(s){
        s.el.style.maxHeight = s.maxHeight;
        s.el.style.overflow = s.overflow;
      });
    };
  }

  function handleAdminShare(){
    var btn = document.getElementById("adminShareBtn");
    var app = document.getElementById("app");
    var actionsEl = app ? app.querySelector(".topbar-actions") : null;
    if(!app) return;
    if(btn){ btn.disabled = true; btn.textContent = "Gerando imagem..."; }

    function restoreBtn(){
      if(btn){ btn.disabled = false; btn.textContent = "Compartilhar como imagem"; }
    }

    ensureHtml2Canvas().then(function(){
      var bg = getComputedStyle(document.documentElement).getPropertyValue("--cream").trim() || "#FBF4E6";
      if(actionsEl) actionsEl.style.visibility = "hidden";
      var restoreScroll = expandScrollListsForCapture_(app);
      return html2canvas(app, {backgroundColor: bg, scale: 2, useCORS: true}).then(function(canvas){
        restoreScroll();
        if(actionsEl) actionsEl.style.visibility = "";
        return canvas;
      }, function(err){
        restoreScroll();
        if(actionsEl) actionsEl.style.visibility = "";
        throw err;
      });
    }).then(function(canvas){
      return new Promise(function(resolve, reject){
        canvas.toBlob(function(blob){
          if(blob) resolve(blob); else reject(new Error("toBlob_failed"));
        }, "image/jpeg", 0.92);
      });
    }).then(function(blob){
      var fileName = "escala-geracao-band-admin-" + toISODate(new Date()) + ".jpg";
      var file = null;
      try{ file = new File([blob], fileName, {type: "image/jpeg"}); }catch(e){}

      if(file && navigator.canShare && navigator.canShare({files: [file]})){
        return navigator.share({
          files: [file],
          title: "Painel Geração Band",
          text: "Estatísticas do Geração Band"
        }).catch(function(err){
          if(err && err.name === "AbortError") return; // a pessoa cancelou o compartilhamento
          throw err;
        });
      }

      // Sem suporte a compartilhar arquivo direto (comum em computador):
      // baixa a imagem pra anexar manualmente no WhatsApp Web/app.
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
      showToast("Imagem baixada — abra o WhatsApp e anexe o arquivo pra enviar.");
    }).then(function(){
      restoreBtn();
    }).catch(function(err){
      if(actionsEl) actionsEl.style.visibility = "";
      restoreBtn();
      showToast("Não foi possível gerar a imagem. Tente de novo.");
    });
  }

  function fetchState(){
    return fetch(APPS_SCRIPT_URL + "?t=" + Date.now(), {cache: "no-store"}).then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  function saveState(newState, actor){
    pruneOldAssignments(newState);
    var expectedUpdatedAt = currentState ? currentState.updatedAt : null;
    var body = {state: newState, expectedUpdatedAt: expectedUpdatedAt};
    if(actor) body.actor = actor;
    return fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(body)
    }).then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function(data){
      if(data.ok){
        render(data.state);
        showToast("Salvo!");
        return true;
      }
      if(data.conflict){
        render(data.current);
        showToast("A escala foi atualizada por outra pessoa nesse instante. Confira e tente de novo.");
        return false;
      }
      showToast("Não foi possível salvar agora. Tente novamente.");
      return false;
    }).catch(function(){
      showToast("Sem conexão. Verifique a internet e tente de novo.");
      return false;
    });
  }

  function handleConfirmAssign(){
    if(!pendingSlot) return;
    var input = document.getElementById("modalNameInput");
    var name = (input.value || "").trim();
    if(!name){ input.focus(); return; }
    try{ localStorage.setItem("gbrp_meuNome", name); }catch(e){}
    var confirmBtn = document.getElementById("modalConfirmBtn");
    if(confirmBtn){ confirmBtn.disabled = true; confirmBtn.textContent = "Salvando..."; }
    var newState = cloneState(currentState);
    setAssignment(newState, pendingSlot.weekId, pendingSlot.periodId, pendingSlot.roleId, name);
    saveState(newState).then(function(ok){
      if(!ok && confirmBtn){ confirmBtn.disabled = false; confirmBtn.textContent = "Confirmar"; }
      if(ok) closeModal();
    });
  }

  function handleRemoveAssign(){
    if(!pendingSlot) return;
    var savedMe = "";
    try{ savedMe = localStorage.getItem("gbrp_meuNome") || ""; }catch(e){}
    if(!savedMe){
      openRemoverPromptModal();
      return;
    }
    performRemoveAssign(savedMe);
  }

  function openRemoverPromptModal(){
    var box = document.getElementById("modalBox");
    box.innerHTML =
      '<h3>Quem está removendo?</h3>' +
      '<div class="modal-sub">Só para a gente saber quem tirou o nome dessa vaga.</div>' +
      '<label for="modalRemoverInput">Seu nome</label>' +
      '<input type="text" id="modalRemoverInput" placeholder="Digite seu nome" autocomplete="off">' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn btn-ghost" id="modalCancelBtn">Cancelar</button>' +
        '<button type="button" class="btn btn-primary" id="modalRemoverConfirmBtn">Confirmar</button>' +
      '</div>';
    document.getElementById("modalOverlay").hidden = false;
    var input = document.getElementById("modalRemoverInput");
    setTimeout(function(){ input.focus(); }, 30);
  }

  function handleRemoverConfirm(){
    var input = document.getElementById("modalRemoverInput");
    var name = (input.value || "").trim();
    if(!name){ input.focus(); return; }
    try{ localStorage.setItem("gbrp_meuNome", name); }catch(e){}
    performRemoveAssign(name);
  }

  function performRemoveAssign(removerName){
    if(!pendingSlot) return;
    var newState = cloneState(currentState);
    setAssignment(newState, pendingSlot.weekId, pendingSlot.periodId, pendingSlot.roleId, "");
    saveState(newState, removerName).then(function(ok){ if(ok) closeModal(); });
  }

  function handleSaveMe(){
    var input = document.getElementById("modalNameInput");
    var name = (input.value || "").trim();
    try{ localStorage.setItem("gbrp_meuNome", name); }catch(e){}
    updateMeLabel();
    closeModal();
  }

  function handleAddRoster(){
    var input = document.getElementById("rosterAddInput");
    var name = (input.value || "").trim();
    if(!name) return;
    var newState = cloneState(currentState);
    if(newState.roster.indexOf(name) === -1){
      newState.roster.push(name);
      newState.roster.sort(function(a,b){ return a.localeCompare(b, "pt-BR"); });
    }
    saveState(newState);
  }

  function handleRemoveRoster(name){
    var newState = cloneState(currentState);
    newState.roster = newState.roster.filter(function(n){ return n !== name; });
    saveState(newState);
  }

  function wireEvents(){
    document.addEventListener("click", function(e){
      var t = e.target;

      var retryBtn = t.closest && t.closest("#retryBtn");
      if(retryBtn){ init(); return; }

      var themeBtn = t.closest && t.closest("#themeToggleBtn");
      if(themeBtn){
        var order = ["system","light","dark"];
        var next = order[(order.indexOf(getThemePref()) + 1) % order.length];
        try{ localStorage.setItem("gbrp_theme", next); }catch(e){}
        applyTheme(next);
        updateThemeButton();
        return;
      }

      var meBtn = t.closest && t.closest("#meBtn");
      if(meBtn){ openMeModal(); return; }

      var toggleRoster = t.closest && t.closest("#toggleRosterBtn");
      if(toggleRoster){
        var panel = document.getElementById("rosterPanel");
        panel.hidden = !panel.hidden;
        toggleRoster.textContent = panel.hidden ? "Ver equipe (roster)" : "Esconder equipe";
        return;
      }

      var adminToggleBtn = t.closest && t.closest("#adminToggleBtn");
      if(adminToggleBtn){ openAdminPinModal(); return; }

      var adminShareBtn = t.closest && t.closest("#adminShareBtn");
      if(adminShareBtn){ handleAdminShare(); return; }

      var adminBackBtn = t.closest && t.closest("#adminBackBtn");
      if(adminBackBtn){ exitAdmin(); return; }

      if(t.id === "modalAdminSubmitBtn"){ handleAdminPinSubmit(); return; }

      var actionEl = t.closest && t.closest("[data-action]");
      if(actionEl){
        var action = actionEl.getAttribute("data-action");
        if(action === "assign" || action === "edit"){
          openAssignModal(actionEl.getAttribute("data-slot"));
        } else if(action === "remove-roster"){
          handleRemoveRoster(actionEl.getAttribute("data-name"));
        } else if(action === "add-roster"){
          handleAddRoster();
        } else if(action === "flip-front" || action === "flip-back"){
          flipPeriod(actionEl.getAttribute("data-period-key"), action === "flip-front");
        } else if(action === "remove-song"){
          handleRemoveSong(actionEl.getAttribute("data-week"), parseInt(actionEl.getAttribute("data-idx"), 10));
        } else if(action === "edit-song"){
          openEditSongModal(actionEl.getAttribute("data-week"), parseInt(actionEl.getAttribute("data-idx"), 10));
        } else if(action === "add-song"){
          var addWrap = actionEl.closest(".song-add");
          var addInput = addWrap ? addWrap.querySelector(".song-add-input") : null;
          if(addInput) handleAddSong(actionEl.getAttribute("data-week"), addInput);
        }
        return;
      }

      if(t.id === "modalCancelBtn"){ closeModal(); return; }
      if(t.id === "modalConfirmBtn"){ handleConfirmAssign(); return; }
      if(t.id === "modalRemoveBtn"){ handleRemoveAssign(); return; }
      if(t.id === "modalRemoverConfirmBtn"){ handleRemoverConfirm(); return; }
      if(t.id === "modalSaveMeBtn"){ handleSaveMe(); return; }
      if(t.id === "modalConfirmSongBtn"){ handleConfirmSong(); return; }
      if(t.id === "modalRemoveSongBtn"){ handleRemoveSongModal(); return; }
      if(t.id === "modalOverlay"){ closeModal(); return; }

      var quickPick = t.closest && t.closest(".quick-pick");
      if(quickPick){
        var inp = document.getElementById("modalNameInput");
        if(inp){ inp.value = quickPick.getAttribute("data-fill"); inp.focus(); }
        return;
      }
    });

    document.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        if(document.activeElement && document.activeElement.id === "modalNameInput"){
          if(document.getElementById("modalConfirmBtn")) handleConfirmAssign();
          else if(document.getElementById("modalConfirmSongBtn")) handleConfirmSong();
          else if(document.getElementById("modalSaveMeBtn")) handleSaveMe();
        } else if(document.activeElement && document.activeElement.id === "rosterAddInput"){
          handleAddRoster();
        } else if(document.activeElement && document.activeElement.id === "modalAdminPinInput"){
          handleAdminPinSubmit();
        } else if(document.activeElement && document.activeElement.id === "modalRemoverInput"){
          handleRemoverConfirm();
        } else if(document.activeElement && document.activeElement.classList && document.activeElement.classList.contains("song-add-input")){
          var addWrap2 = document.activeElement.closest(".song-add");
          var addBtn2 = addWrap2 && addWrap2.querySelector('[data-action="add-song"]');
          if(addBtn2) handleAddSong(addBtn2.getAttribute("data-week"), document.activeElement);
        }
      }
      if(e.key === "Escape"){ closeModal(); }
    });

    document.addEventListener("visibilitychange", function(){
      if(document.hidden){
        stopPolling();
        stopAdminPolling();
      } else {
        startPolling();
        if(adminMode) startAdminPolling();
      }
    });
  }

  function startPolling(){
    stopPolling();
    pollTimer = setInterval(function(){
      if(document.hidden || isModalOpen() || !currentState || adminMode) return;
      fetchState().then(function(s){
        if(s && s.updatedAt !== currentState.updatedAt){
          render(s);
        }
      }).catch(function(){});
    }, 25000);
  }
  function stopPolling(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }

  function init(){
    var app = document.getElementById("app");
    app.innerHTML = loadingHtml();
    fetchState().then(function(s){
      currentState = s;
      render(s);
      startPolling();
    }).catch(function(){
      app.innerHTML = errorHtml();
    });
  }

  function mount(){
    wireEvents();
    init();
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
