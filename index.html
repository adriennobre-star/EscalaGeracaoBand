<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurar Escala Geração Band</title>
<style>
:root{color-scheme:light dark;}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  max-width:520px;margin:0 auto;padding:24px 18px 60px;
  background:#FBF4E6;color:#1E2A28;
}
@media (prefers-color-scheme:dark){ body{background:#0E211F;color:#F3ECDC;} }
h1{font-size:20px;margin-bottom:4px;}
p{line-height:1.5;font-size:14.5px;}
button{
  display:block;width:100%;padding:14px;border-radius:12px;border:none;
  background:#1B7D77;color:#fff;font-size:16px;font-weight:700;cursor:pointer;
  margin:18px 0;
}
button:disabled{opacity:.6;}
#result{
  margin-top:16px;padding:14px;border-radius:10px;background:rgba(27,125,119,.12);
  border:1.5px solid #1B7D77;word-break:break-all;font-size:13.5px;display:none;
}
#result.show{display:block;}
#result code{display:block;margin-top:8px;font-size:15px;font-weight:700;user-select:all;}
#err{color:#B14B3A;margin-top:12px;font-size:13.5px;display:none;}
</style>
</head>
<body>
<h1>Configurar armazenamento</h1>
<p>Este passo é só seu (Adrien), uma única vez. Toque no botão abaixo para criar o "banco de dados" gratuito que vai guardar as escalas — assim ninguém mais vai precisar fazer login pra se inscrever.</p>
<button id="go">Criar armazenamento</button>
<div id="result">
  <span>Deu certo! Copie o código abaixo e me envie de volta no chat:</span>
  <code id="code"></code>
</div>
<div id="err"></div>
<script>
var INITIAL_STATE = {
  version: 2,
  church: "Rio Prado",
  assignments: {},
  roster: ["Caio","Cami","Davison","Gio","Italo","Manu","Riedja"],
  updatedAt: new Date().toISOString()
};
document.getElementById("go").addEventListener("click", function(){
  var btn = this;
  btn.disabled = true;
  btn.textContent = "Criando...";
  document.getElementById("err").style.display = "none";
  fetch("https://api.jsonstorage.net/v1/json", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(INITIAL_STATE)
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(data){
    var uri = data.uri || "";
    var id = uri.split("/v1/json/")[1] || uri;
    document.getElementById("code").textContent = id;
    document.getElementById("result").className = "show";
    btn.textContent = "Feito!";
  }).catch(function(e){
    var el = document.getElementById("err");
    el.textContent = "Não deu certo: " + e.message + ". Tenta de novo em alguns segundos.";
    el.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Criar armazenamento";
  });
});
</script>
</body>
</html>
